<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <meta name="description" content="NoStage, la future application pour rechercher un stage ou un premier emploi et suivre ses démarches.">
  <title>NoStage | Trouver son prochain stage</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #eef3f8; color: #17324d; }
    main { width: min(100%, 620px); padding: clamp(28px, 6vw, 56px); border-radius: 22px; background: white; box-shadow: 0 14px 50px rgba(20, 47, 70, .08); }
    .tag { margin: 0 0 24px; font-size: .83rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #466c85; }
    h1 { margin: 0 0 12px; font-size: clamp(2.6rem, 10vw, 4.4rem); letter-spacing: -.055em; line-height: 1.08; }
    .lead { margin: 0 0 18px; font-size: clamp(1.2rem, 3vw, 1.5rem); font-weight: 600; }
    p { line-height: 1.65; }
    .note { margin: 30px 0 0; padding-top: 20px; border-top: 1px solid #e1e8ee; color: #496377; font-size: .95rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #101b27; color: #eaf2fb; }
      main { background: #1a2a39; box-shadow: none; }
      .tag { color: #9ac8e9; }
      .note { color: #bed0df; border-color: #34495a; }
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">Bienvenue sur NoStage</p>
    <h1>NoStage</h1>
    <p class="lead">Votre prochain stage commence ici.</p>
    <p>Une application pour découvrir des entreprises, organiser sa recherche de stage et suivre ses candidatures.</p>
    <p class="note">Application en cours de développement.</p>
  </main>
</body>
</html>
